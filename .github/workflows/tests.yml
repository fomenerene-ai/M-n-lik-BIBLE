# Tests unitaires et contrôle des histoires sur chaque branche.
name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test "parley/tests/*.test.js"
      - run: node parley/tools/check-secrets.mjs
      - run: node parley/tools/validate-manifest.mjs
      - run: npm run check:stories
      - run: npm run build

  lectio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lectio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lectio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
