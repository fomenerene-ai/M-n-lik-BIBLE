# Netlify : dossier publié = ce dossier. Généré par build.py, ne pas éditer à la main.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# CSP stricte sur les pages servies (hashes des scripts inline calculés par build.py).
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-sDD9zzaUtVaV6HpDGdU6v7dndCYNBZHtqIRB28OIf2c=' 'sha256-VH4dccC0Cah2umKIVEFmVm81msVHEWNLo5kET/cB0bo=' 'sha256-jXS86J3WiaDfvZoKKpPwTR+6s9KlXRrZnhE46gutpJY='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-sDD9zzaUtVaV6HpDGdU6v7dndCYNBZHtqIRB28OIf2c=' 'sha256-VH4dccC0Cah2umKIVEFmVm81msVHEWNLo5kET/cB0bo=' 'sha256-jXS86J3WiaDfvZoKKpPwTR+6s9KlXRrZnhE46gutpJY='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/mentions-legales.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/confidentialite.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/shapes/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
